[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surfaceguard"
version = "0.1.0"
description = "Industrial surface anomaly detection (PatchCore + WinCLIP) with Streamlit UI"
requires-python = ">=3.9"

[tool.setuptools]
package-dir = {"" = "src"}

